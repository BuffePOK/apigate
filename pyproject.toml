[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apigate"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible gateway over pools of API keys (Gemini, OpenAI, Claude, DeepSeek, ...) with limits, credits and a web UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
apigate = "apigate.cli:main"

[tool.setuptools.packages.find]
include = ["apigate*"]

[tool.setuptools.package-data]
apigate = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
