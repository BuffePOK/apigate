# /etc/nginx/snippets/apigate-proxy.conf
# unix socket owned by the project user (group = the project's group, which www-data belongs to)
proxy_pass http://unix:/srv/apps/apigate/run/apigate.sock;
# Docker-compose variant (TCP on loopback):  proxy_pass http://127.0.0.1:18731;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # overwrite (not append) - clients cannot spoof their IP
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
# streaming (SSE) must not be buffered; long generations need long timeouts
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
