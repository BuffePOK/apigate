# /etc/nginx/sites-available/llm-apis.ans3r.eu  (symlink into sites-enabled)
# Step 1: with only the port-80 block, run:  sudo certbot --nginx -d llm-apis.ans3r.eu   (certbot adds the 443 block + redirect)
# Step 2: make sure the 443 block contains the "location /" settings below.

limit_req_zone $binary_remote_addr zone=apigate_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name llm-apis.ans3r.eu;

    server_tokens off;
    client_max_body_size 12m;          # the app itself limits bodies too

    location = /api/auth/login {
        limit_req zone=apigate_login burst=5 nodelay;
        include /etc/nginx/snippets/apigate-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/apigate-proxy.conf;
    }
}
